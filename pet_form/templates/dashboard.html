<style>
    h1 {
        text-align: center;
    }
    div {
        width:70%;
        margin: auto;
        padding: 10px;
        margin-bottom: 10px;
    }
</style>

<h1>
    <center>Dashboard</center>
</h1>

{% for pet in pets %}

<div>

    <h3>{{ pet.username }}</h3>

    <p>Name:  {{ pet.name }}</p>

    <p>Color:  {{ pet.color }}</p>

    <p>Behavior:  {{ pet.behavior }}</p>
    
    <p>Breed:  {{ pet.breed }}</p>


</div>

<hr>

{% empty %}

<p>No pets added yet 😿</p>

{% endfor %}
